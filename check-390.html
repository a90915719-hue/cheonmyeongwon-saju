<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>천명원 390px 검증 화면</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1026; }
  #phone { display: block; width: 390px; height: 844px; border: 0; background: #000; }
</style>
</head>
<body>
<!-- 검증용 임시 화면: 실제 라이브 index.html 을 390px 폭으로 띄웁니다. -->
<iframe id="phone" width="390" height="844" title="390px 검증"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('phone');
  var h = parseInt(q.get('h') || '844', 10);
  var hash = q.get('hash') || '';
  var v = q.get('v') || String(Date.now());
  f.style.height = h + 'px';
  f.setAttribute('height', String(h));
  if (q.get('sameorigin') === '1') {
    f.removeAttribute('sandbox');
  } else {
    f.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals');
  }
  f.src = 'index.html?v=' + encodeURIComponent(v) + (hash ? '#' + hash : '');
  window.__frame = f;
})();
</script>
</body>
</html>
